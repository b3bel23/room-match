<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar visita · Room Match</title>
    <link rel="stylesheet" href="../design-tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/agendar-visita.css">
</head>
<body class="agendar-page">

    <header class="site-header">
        <a href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav>
            <a class="ativo" href="home.html">Explorar</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="#">Mensagens</a>
            <span class="usuario"><span class="usuario-foto">MS</span>Maria Silva</span>
        </nav>
    </header>

    <main class="agendar-main">
        <form id="agendar-form" class="agendar-card">
            <a class="btn-voltar-pagina" href="detalhe.html">← Voltar ao imóvel</a>
            <h1>Agendar visita</h1>
            <p class="agendar-imovel">Kitnet mobiliada · Cambuí · R$ 1.200/mês</p>

            <div class="calendario">
                <div class="calendario-topo">
                    <button id="mes-anterior" class="calendario-nav" type="button" aria-label="Mês anterior">&lsaquo;</button>
                    <strong id="mes-titulo" aria-live="polite"></strong>
                    <button id="mes-proximo" class="calendario-nav" type="button" aria-label="Próximo mês">&rsaquo;</button>
                </div>
                <div id="calendario-grade" class="calendario-grade"></div>
            </div>

            <fieldset id="horarios" class="horarios" hidden>
                <legend id="horarios-titulo">Horários disponíveis</legend>
                <div id="horarios-lista" class="horarios-lista"></div>
            </fieldset>

            <button id="agendar-confirmar" class="btn btn-primary" type="submit" disabled>Confirmar visita</button>
            <p id="agendar-nota" class="agendar-nota">O locador recebe o pedido no chat.</p>
            <p id="agendar-retorno" class="agendar-nota" role="status" hidden></p>
        </form>
    </main>

    <footer class="site-footer">
        <img src="../assets/logo.svg" alt="RoomMatch">
        <nav>
            <a href="#">Como funciona</a>
            <a href="#">Termos e privacidade</a>
        </nav>
        <small>© 2026 RoomMatch</small>
    </footer>

    <script src="../js/sessao.js"></script>
    <script src="../js/agendar-visita.js"></script>
</body>
</html>
