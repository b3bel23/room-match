<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar anúncio · Room Match</title>
    <link rel="stylesheet" href="../design-tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/cadastro.css">
    <link rel="stylesheet" href="../css/editar-anuncio.css">
</head>
<body class="editar-page">

    <header class="site-header">
        <a class="logo" href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav>
            <a class="ativo" href="home.html">Explorar</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="mensagens.html">Mensagens</a>
            <span class="usuario"><span class="usuario-foto">LD</span></span>
        </nav>
    </header>

    <main class="editar-main">
        <a class="btn-voltar-pagina" href="home.html">← Voltar</a>

        <form id="editar-form" class="editar-card">
            <h1>Editar anúncio</h1>
            <p class="editar-imovel">Quarto em república · Barão Geraldo</p>

            <div class="campo">
                <label for="titulo">Título</label>
                <input id="titulo" type="text" value="Quarto em república · Barão Geraldo" required>
            </div>
            <div class="campo">
                <label for="aluguel">Aluguel (R$)</label>
                <input id="aluguel" type="number" min="0" step="1" inputmode="numeric" value="600" required>
            </div>
            <div class="campo">
                <label for="condominio">Condomínio (R$)</label>
                <input id="condominio" type="number" min="0" step="1" inputmode="numeric" value="120" required>
            </div>
            <div class="campo">
                <label for="iptu">Imposto predial (R$)</label>
                <input id="iptu" type="number" min="0" step="1" inputmode="numeric" value="45" required>
            </div>
            <div class="campo">
                <label for="contas">Contas (R$)</label>
                <input id="contas" type="number" min="0" step="1" inputmode="numeric" value="85" required>
            </div>

            <p class="editar-total">Total mensal: <strong id="editar-total">R$ 850</strong></p>

            <div class="editar-acoes">
                <a class="btn btn-secondary btn-cancelar" href="home.html">Cancelar</a>
                <button class="btn btn-primary" type="submit">Salvar</button>
            </div>
            <p id="editar-retorno" class="editar-retorno" role="status" hidden></p>
        </form>
    </main>

    <footer class="site-footer">
        <a class="logo" href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav>
            <a href="como-funciona.html">Como funciona</a>
            <a href="termos.html">Termos e privacidade</a>
        </nav>
        <small>© 2026 RoomMatch</small>
    </footer>

    <script src="../js/mock-api.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sessao.js"></script>
    <script src="../js/papel-ui.js"></script>
    <script src="../js/chrome.js"></script>
    <script src="../js/page-motion.js"></script>

    <script src="../js/editar-anuncio.js"></script>
</body>
</html>
