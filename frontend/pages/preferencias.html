<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferências · Room Match</title>
    <link rel="stylesheet" href="../design-tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/favoritos.css">
    <link rel="stylesheet" href="../css/config.css">
</head>
<body class="favoritos-page">
    <header class="site-header">
        <a href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav>
            <a href="home.html">Explorar</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="mensagens.html">Mensagens</a>
            <span class="usuario"><span class="usuario-foto">MS</span></span>
            <a class="sair" href="#">Sair</a>
        </nav>
    </header>
    <div class="vista-lista">
        <div class="page-bar">
            <h1>Configurações</h1>
            <span class="page-bar-sub">Afinidade e orçamento</span>
        </div>
        <div class="layout">
            <aside class="sidebar"></aside>
            <main class="conteudo">
                <h2>Preferências</h2>
                <p class="conteudo-sub">Campos do schema <code>locatario</code></p>
                <form id="pref-form" class="config-form">
                    <label>orcamento_maximo (R$)
                        <input id="pref-orcamento" name="orcamento_maximo" type="number" min="0" step="50" required>
                    </label>
                    <label>limiar_compatibilidade (%)
                        <input id="pref-limiar" name="limiar_compatibilidade" type="number" min="0" max="100" required>
                    </label>
                    <div>
                        <p style="font-size:13px;font-weight:600;margin-bottom:8px">tags (usuario_tag / convivência)</p>
                        <div id="pref-tags" class="config-tags"></div>
                    </div>
                    <button class="btn btn-primary" type="submit">Salvar</button>
                    <p id="pref-retorno" class="config-retorno" hidden></p>
                </form>
            </main>
        </div>
    </div>
    <footer class="site-footer">
        <img src="../assets/logo.svg" alt="RoomMatch">
        <nav>
            <a href="como-funciona.html">Como funciona</a>
            <a href="termos.html">Termos e privacidade</a>
        </nav>
        <small>© 2026 RoomMatch</small>
    </footer>
    <script src="../js/mock-api.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sessao.js"></script>
    <script src="../js/papel-ui.js"></script>
    <script src="../js/config-shell.js"></script>
    <script src="../js/chrome.js"></script>
    <script src="../js/tags-catalogo.js"></script>
    <script src="../js/preferencias.js"></script>
</body>
</html>
