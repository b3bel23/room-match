<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha · Room Match</title>
    <link rel="stylesheet" href="../design-tokens.css?v=20261123">
    <link rel="stylesheet" href="../css/base.css?v=20261124sn">
    <link rel="stylesheet" href="../css/login.css?v=20261124bx">
    <link rel="stylesheet" href="../css/config.css?v=20261124by">
</head>
<body class="auth-page">

    <header class="site-header">
        <a class="logo" href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav class="nav-visitante">
            <a href="como-funciona.html">Como funciona</a>
            <a class="btn btn-secondary" href="login.html">Entrar</a>
            <a class="btn btn-primary" href="escolha-papel.html">Cadastrar</a>
        </nav>
    </header>

    <main class="login-main">
        <a class="btn-voltar" href="login.html">← Voltar</a>
        <div class="login-split">
            <section class="login-hero login-hero-rua hero-degrade" data-hero-campinas aria-label="Rua de Campinas">
                <div class="login-hero-corpo">
                    <h2>Recuperar senha</h2>
                    <p id="recuperar-hero-texto">Enviamos um link seguro para redefinir o acesso à sua conta.</p>
                </div>
                <div class="login-hero-rodape login-hero-rodape--so-logo">
                    <img class="login-hero-logo" src="../assets/logo.svg" alt="RoomMatch">
                </div>
            </section>
            <section class="login-card">
                <h1>Esqueci minha senha</h1>
                <p class="login-subtitle" id="recuperar-subtitulo">Informe o e-mail cadastrado</p>
                <form id="recuperar-form" class="login-form">
                    <div class="field">
                        <label for="recuperar-email">E-mail</label>
                        <input id="recuperar-email" type="email" required placeholder="seu@email.com">
                    </div>
                    <button type="submit" class="btn-entrar">Enviar link</button>
                    <p id="recuperar-retorno" class="config-retorno" hidden></p>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <a class="logo" href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav>
            <a href="como-funciona.html">Como funciona</a>
            <a href="termos.html">Termos e privacidade</a>
        </nav>
        <small>© 2026 RoomMatch · região metropolitana de Campinas</small>
    </footer>

    <script src="../js/mock-api.js?v=20261124al"></script>
    <script src="../js/api.js?v=20261124al"></script>
    <script src="../js/sessao.js?v=20261124sn"></script>
    <script src="../js/papel-ui.js?v=20261123"></script>
    <script src="../js/chrome.js?v=20261124"></script>
    <script src="../js/loading-ui.js?v=20261124af"></script>
    <script src="../js/page-motion.js?v=20261124ae"></script>
    <script>
        (async function () {
            const form = document.getElementById('recuperar-form');
            const r = document.getElementById('recuperar-retorno');
            const botao = form.querySelector('button[type="submit"]');
            // Descobre se SMTP está ativo com um pedido “vazio” seguro — a API
            // responde email_envio_disponivel:false sem SMTP (e-mail fictício).
            try {
                const probe = await RoomMatchApi.recuperarSenha('probe@roommatch.local');
                if (probe && probe.email_envio_disponivel === false) {
                    form.hidden = true;
                    document.getElementById('recuperar-subtitulo').textContent =
                        'Recuperação por e-mail indisponível neste ambiente.';
                    document.getElementById('recuperar-hero-texto').textContent =
                        'Neste ambiente o envio de e-mail não está configurado.';
                    r.textContent = probe.message
                        || 'Peça a um administrador para configurar SMTP, ou use uma conta já logada.';
                    r.classList.add('erro');
                    r.hidden = false;
                    return;
                }
            } catch (erro) {
                /* segue o formulário; o submit trata erro real */
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                if (typeof RoomMatchLoading !== 'undefined') {
                    RoomMatchLoading.botaoEspera(botao, true, 'Enviando…');
                    RoomMatchLoading.mostrar('Enviando e-mail…');
                }
                try {
                    const dados = await RoomMatchApi.recuperarSenha(
                        document.getElementById('recuperar-email').value.trim()
                    );
                    r.textContent = dados.message;
                    r.classList.toggle('erro', dados.ok === false);
                    r.hidden = false;
                    if (dados.email_envio_disponivel === false) {
                        form.hidden = true;
                    }
                } catch (erro) {
                    r.textContent = erro.message;
                    r.classList.add('erro');
                    r.hidden = false;
                } finally {
                    if (typeof RoomMatchLoading !== 'undefined') {
                        RoomMatchLoading.forcarEsconder();
                        RoomMatchLoading.botaoEspera(botao, false);
                    }
                }
            });
        }());
    </script>
    <script src="../js/imovel-fotos.js?v=20261124bx"></script>
    <script src="../js/auth-hero.js?v=20261124bx"></script>
</body>
</html>
