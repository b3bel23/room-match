<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança · Room Match</title>
    <link rel="stylesheet" href="../design-tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/favoritos.css">
    <link rel="stylesheet" href="../css/config.css">
</head>
<body class="favoritos-page">
    <header class="site-header">
        <a class="logo" href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav>
            <a href="home.html">Explorar</a>
            <a href="favoritos.html">Favoritos</a>
            <a href="mensagens.html">Mensagens</a>
            <span class="usuario"><span class="usuario-foto">MS</span></span>
            <a class="sair" href="#">Sair</a>
        </nav>
    </header>
    <div class="vista-lista">
        <div class="page-bar">
            <h1>Configurações</h1>
            <span class="page-bar-sub">Senha e acesso</span>
        </div>
        <div class="layout">
            <aside class="sidebar"></aside>
            <main class="conteudo">
                <h2>Segurança</h2>
                <p class="conteudo-sub">Altere a senha da sua conta.</p>
                <form id="senha-form" class="config-form">
                    <label>Senha atual<input id="senha-atual" type="password" required></label>
                    <label>Nova senha<input id="senha-nova" type="password" minlength="6" required></label>
                    <label>Confirmar nova senha<input id="senha-confirma" type="password" minlength="6" required></label>
                    <button class="btn btn-primary" type="submit">Atualizar senha</button>
                    <p id="senha-retorno" class="config-retorno" hidden></p>
                </form>
            </main>
        </div>
    </div>
    <footer class="site-footer">
        <a class="logo" href="home.html"><img src="../assets/logo.svg" alt="RoomMatch"></a>
        <nav>
            <a href="como-funciona.html">Como funciona</a>
            <a href="termos.html">Termos e privacidade</a>
        </nav>
        <small>© 2026 RoomMatch</small>
    </footer>
    <script src="../js/mock-api.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/sessao.js"></script>
    <script src="../js/papel-ui.js"></script>
    <script src="../js/config-shell.js"></script>
    <script src="../js/chrome.js"></script>
    <script src="../js/page-motion.js"></script>
    <script src="../js/seguranca.js"></script>
</body>
</html>
